<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HubSpot Login and Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" href="./images/login-page-logo.png">
</head>

<body>
    <div class="signin-page">
        <div class="cont-details">
            <a href="https://hub-spot-sepia.vercel.app/"><img src="./images/hubspot_logo.png" alt=""></a>
            <p id="one">Sign in</p>
            <p id="two">or <span>create an account</span></p>

            <div class="input-email">
                <label for="">Email</label>
                <input type="text" placeholder="Enter your email">
            </div>
            <button id="button"> Continue</button>

            <div id="three"><p>See how HubSpot can help you achieve your growth goals. </p><button>Get a demo</button></div>
        </div>

        <p id="policies">
            ©2026 HubSpot, Inc. All Rights Reserved. <a href="">Privacy Policy</a>
            <a href="">Manage Cookies</a>
        </p>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
