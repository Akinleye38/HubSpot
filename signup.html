<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HubSpot | Software & Tools for you</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" href="./images/favicon.png">
</head>

<body>

    <main class="signup-pg">
        <div class="signup">
            <img src="./images/hubspot_logo.png" alt="">
            <p id="create">Create your account</p>
            <p id="free">100% free. No credit card needed.</p>
            <div class="button">
                <button><i class="fa-brands fa-google"></i> <span>Continue with Google</span></button>
                <button><img src="./images/imgi_2_microsoft.png" alt=""> <span>Continue with Microsoft</span></button>
                <button><img src="./images/imgi_3_apple.png" alt=""> <span>Continue with Apple</span></button>
                <button><img src="./images/imgi_5_default.png" alt=""> <span>Continue with ChatGPT</span></button>
            </div>
            <p id="or">OR</p>
            <input type="text" placeholder="name@company.com">
            <span id="continue">Continue with email</span>
            <p id="warning">
                By continuing, you acknowledge HubSpot's <a href="">Privacy Policy</a> and agree to get occasional
                product
                updates and
                promotional emails.
            </p>
            <p id="sign-in">Have an account? <a href="">Sign in</a></p>
        </div>

        <p class="manage-cookies">Manage Cookies</p>

    </main>

    <div class="chat-widget">
        <i class="fa-regular fa-message"></i>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
